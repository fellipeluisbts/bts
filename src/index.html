<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BTS Browser</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="chrome-shell">
    <div class="tab-strip">
      <div id="tabs" class="tabs"></div>
      <button id="new-tab" class="icon-button tab-add" title="Nova aba">+</button>
      <div class="window-controls" aria-hidden="true"><span></span><span></span><span></span></div>
    </div>
    <div class="toolbar">
      <div class="nav-actions">
        <button class="icon-button" data-action="back" title="Voltar">&#8592;</button>
        <button class="icon-button" data-action="forward" title="Avançar">&#8594;</button>
        <button id="reload" class="icon-button" data-action="reload" title="Recarregar">&#8635;</button>
      </div>
      <form id="address-form" class="address-form">
        <span class="site-info">&#128274;</span>
        <input id="address" autocomplete="off" spellcheck="false" aria-label="Barra de endereço" placeholder="Pesquisar ou digitar um endereço">
        <button id="bookmark" class="address-action" type="button" title="Adicionar aos favoritos">&#9734;</button>
      </form>
      <button class="icon-button more" data-action="devtools" title="Mais opções">&#8942;</button>
    </div>
    <div class="bookmarks-bar" id="bookmarks-bar"></div>
  </header>
  <aside id="toast" class="toast" aria-live="polite"></aside>
  <script src="renderer.js"></script>
</body>
</html>
